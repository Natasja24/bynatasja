      "body": "Ik was een klein meisje van ongeveer zes jaar oud toen het begon.\nOp de basisschool was ik dat stille meisje. Verlegen, teruggetrokken en iemand die weinig zei. Ik probeerde zo min mogelijk op te vallen, maar toch was ik degene die steeds opnieuw werd gepest.\n\nHet pesten kwam van een groep meiden en jongens. Er waren andere kinderen die net zo stil waren als ik, maar zij werden niet gepest. Ik wel. Steeds weer. Ik werd uitgescholden om mijn uiterlijk, omdat ik dik was. De scheldwoorden kwamen van alle kanten en raakten me diep.\n\nDaarnaast stotterde ik vroeger veel. Ook dat werd een reden om mij belachelijk te maken. Meiden en jongens lachten me uit wanneer ik probeerde te praten. Wanneer ik een boek moest voorlezen in de klas, kwam ik nooit ver. De woorden bleven steken. Mijn hoofd ging steeds naar beneden, omdat ik er niet uitkwam. De schaamte en spanning namen het over.\n\nOok tijdens het buitenspelen hield het pesten niet op. Er was geen veilige plek, geen moment van rust. Jaar na jaar ging het door, tot en met groep 8. Het pesten werd steeds erger.\n\nDoor alles wat er gebeurde ging ik steeds vaker huilend naar huis. Soms liep ik zelfs huilend weg van school. Ik was vaak ziek thuis, niet omdat ik lichamelijk ziek was, maar omdat het mentaal te zwaar werd. School voelde niet langer als een veilige plek, maar als iets wat ik moest overleven.\n\nDit is wat pesten met mij heeft gedaan. Het heeft sporen achtergelaten die niet altijd zichtbaar zijn, maar die ik elke dag met me meedraag.\n\nDoor mijn verhaal te delen hoop ik bij te dragen aan meer begrip, bewustwording en zachtheid voor kinderen die vandaag de dag hetzelfde meemaken.",
      "sort_order": 5
    }
  ]
}</script>
<script>
(function () {
  "use strict";
  var stories = [];
  try {
    stories = JSON.parse(document.getElementById("stories-data").textContent).stories || [];
  } catch (e) {
    stories = [];
  }

  var CATEGORIES = ["Alles", "Leven", "Ondernemen", "Groei", "Reizen"];
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  var filtersEl = document.getElementById("filters");
  var listEl = document.getElementById("storyList");
  var lineEl = document.getElementById("timelineLine");
  var timelineEl = document.getElementById("timeline");
  var reader = document.getElementById("reader");
  var readerMeta = document.getElementById("readerMeta");
  var readerTitle = document.getElementById("readerTitle");
  var readerBody = document.getElementById("readerBody");
  var currentFilter = "Alles";
  var lastFocus = null;

  function metaHTML(s) {
    return esc(s.category) + '<span class="sep">/</span>' + esc(s.date_label) +
      '<span class="sep">/</span>' + esc(s.reading_time) + " lezen";
  }

  function renderFilters() {
    filtersEl.innerHTML = "";
    CATEGORIES.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "filter" + (c === currentFilter ? " active" : "");
      b.textContent = c;
      b.setAttribute("aria-pressed", c === currentFilter ? "true" : "false");
      b.addEventListener("click", function () {
        currentFilter = c;
        renderFilters();
        renderList();
      });
      filtersEl.appendChild(b);
    });
  }

  function renderList() {
    var visible = currentFilter === "Alles"
      ? stories
      : stories.filter(function (s) { return s.category === currentFilter; });
    listEl.innerHTML = "";
    if (!visible.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nog geen verhalen in deze categorie.";
      listEl.appendChild(p);
      return;
    }
    visible.forEach(function (s, i) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "story-link";
      a.href = "#verhaal-" + s.slug;
      a.setAttribute("role", "button");
      a.innerHTML =
        '<div class="story-index"><span>' + pad(i + 1) + "</span></div>" +
        '<div class="story-body">' +
        '<span class="story-dot" aria-hidden="true"></span>' +
        '<div class="story-meta">' + metaHTML(s) + "</div>" +
        '<h3 class="story-title"><span class="link-underline">' + esc(s.title) + "</span></h3>" +
        (s.teaser ? '<p class="story-teaser">' + esc(s.teaser) + "</p>" : "") +
        "</div>";
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        openStory(s);
      });
      li.appendChild(a);
      listEl.appendChild(li);
    });
  }

  function openStory(s) {
    lastFocus = document.activeElement;
    readerMeta.innerHTML = metaHTML(s);
    readerTitle.textContent = s.headline || s.title;
    var paras = String(s.body || "").split(/\n{2,}/).map(function (p) { return p.trim(); }).filter(Boolean);
    readerBody.innerHTML = paras.map(function (p) {
      return "<p>" + p.split("\n").map(esc).join("<br />") + "</p>";
    }).join("");
    reader.classList.add("open");
    document.body.classList.add("locked");
    reader.scrollTop = 0;
    document.getElementById("readerBack").focus();
  }

  function closeReader() {
    reader.classList.remove("open");
    document.body.classList.remove("locked");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.getElementById("readerBack").addEventListener("click", closeReader);
  document.getElementById("readerBack2").addEventListener("click", closeReader);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && reader.classList.contains("open")) closeReader();
  });

  // Fade-in on scroll
  var fades = document.querySelectorAll(".fade");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
      });
    }, { threshold: 0.12 });
    fades.forEach(function (el) { io.observe(el); });
  } else {
    fades.forEach(function (el) { el.classList.add("in"); });
  }

  // Story line draws in as you scroll
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function drawLine() {
    if (reduced) { lineEl.style.transform = "scaleY(1)"; return; }
    var rect = timelineEl.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var start = vh * 0.9;
    var end = vh * 0.55;
    var total = rect.height + (start - end);
    var progress = (start - rect.top) / (total || 1);
    progress = Math.max(0, Math.min(1, progress));
    lineEl.style.transform = "scaleY(" + progress + ")";
  }
  window.addEventListener("scroll", drawLine, { passive: true });
  window.addEventListener("resize", drawLine);

  renderFilters();
  renderList();
  drawLine();
})();
</script>
</body>
</html>
